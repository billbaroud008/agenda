<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NOCTA Packshot</title>
<link rel="stylesheet" href="shared.css">
<style>
  #stage { width: 1080px; height: 1080px; }

  .halo {
    position: absolute; left: 50%; top: 46%; width: 760px; height: 760px;
    margin: -380px 0 0 -380px; border-radius: 50%;
    background: radial-gradient(circle, rgba(255, 90, 31, .55), rgba(255, 90, 31, 0) 62%);
    animation: pulse 8s ease-in-out infinite;
  }
  .ring {
    position: absolute; left: 50%; top: 46%; width: 640px; height: 640px;
    margin: -320px 0 0 -320px; border-radius: 50%;
    border: 2px dashed rgba(242, 232, 218, .25);
    animation: spin 40s linear infinite;
  }
  .word {
    position: absolute; left: -40px; right: -40px; top: 330px;
    font: 360px/1 var(--display); letter-spacing: .02em; text-align: center;
    color: transparent; -webkit-text-stroke: 2px rgba(242, 232, 218, .14);
    white-space: nowrap; animation: drift 16s linear infinite;
  }
  .bottle {
    position: absolute; left: 50%; top: 210px; width: 330px; margin-left: -165px;
    animation: float 8s ease-in-out infinite;
    filter: drop-shadow(0 40px 60px rgba(0, 0, 0, .6));
  }
  .shadow {
    position: absolute; left: 50%; top: 760px; width: 300px; height: 40px; margin-left: -150px;
    border-radius: 50%; background: radial-gradient(rgba(0, 0, 0, .8), transparent 70%);
    animation: shadow 8s ease-in-out infinite;
  }
  .floor {
    position: absolute; left: 0; right: 0; top: 780px; bottom: 0;
    background: linear-gradient(var(--smoke), var(--ink));
  }
  .caption {
    position: absolute; left: 64px; right: 64px; bottom: 64px;
    display: flex; justify-content: space-between; align-items: flex-end;
  }
  .caption h1 { font: 96px/.9 var(--display); letter-spacing: .04em; }
  .caption h1 em { display: block; font: italic 48px/1 var(--serif); letter-spacing: 0; color: var(--ember); }
  .caption p { font: 600 22px/1.4 var(--sans); text-align: right; letter-spacing: .12em; text-transform: uppercase; opacity: .8; }
  .caption > * { animation: rise 8s cubic-bezier(.2, .8, .2, 1) infinite; }
  .caption p { animation-delay: .15s; }

  @keyframes float  { 0%, 100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-28px) rotate(2deg); } }
  @keyframes shadow { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(.8); opacity: .6; } }
  @keyframes pulse  { 0%, 100% { transform: scale(.92); opacity: .8; } 50% { transform: scale(1.06); opacity: 1; } }
  @keyframes spin   { to { transform: rotate(360deg); } }
  @keyframes drift  { from { transform: translateX(0); } to { transform: translateX(-200px); } }
  @keyframes rise {
    0% { transform: translateY(40px); opacity: 0; }
    10%, 90% { transform: translateY(0); opacity: 1; }
    100% { transform: translateY(0); opacity: 0; }
  }
</style>
</head>
<body>
<div id="stage">
  <div class="word">NOCTA NOCTA</div>
  <div class="halo"></div>
  <div class="ring"></div>
  <div class="floor"></div>
  <div class="shadow"></div>
  <div class="bottle"></div>
  <div class="caption">
    <h1>NOCTA<em>Eau de Nuit</em></h1>
    <p>Ambre · Figue noire · Cuir<br>50 ml</p>
  </div>
</div>
<script src="shared.js"></script>
</body>
</html>
