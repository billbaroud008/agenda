<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Siemens Illustration — Galerie</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{--bg:#fbfaf7;--ink:#1d1d1b;--muted:#8a8780;--line:#e7e4dd;--overlay:rgba(251,250,247,.97)}
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif}
  a{color:inherit;text-decoration:none}

  header{max-width:1400px;margin:0 auto;padding:40px 24px 28px;display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:16px}
  .brand{font-family:"Cormorant Garamond",serif;font-size:34px;letter-spacing:.02em}
  nav{display:flex;gap:28px;font-size:12px;letter-spacing:.18em;text-transform:uppercase}
  nav a{color:var(--muted);transition:color .2s}
  nav a:hover,nav a.active{color:var(--ink)}

  .intro{max-width:1400px;margin:0 auto;padding:0 24px 32px}
  .intro h1{font-family:"Cormorant Garamond",serif;font-style:italic;font-weight:500;font-size:22px;margin:0;color:var(--muted)}

  .gallery{max-width:1400px;margin:0 auto;padding:0 24px 80px;columns:3 340px;column-gap:24px}
  .item{break-inside:avoid;margin:0 0 24px;cursor:zoom-in;position:relative;overflow:hidden}
  .item img{width:100%;display:block;transition:transform .6s ease,opacity .6s ease;opacity:0}
  .item img.loaded{opacity:1}
  .item:hover img{transform:scale(1.03)}
  .item figcaption{position:absolute;inset:auto 0 0 0;padding:14px 16px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;background:linear-gradient(transparent,rgba(0,0,0,.45));color:#fff;opacity:0;transition:opacity .3s}
  .item:hover figcaption{opacity:1}

  .empty{max-width:640px;margin:40px auto 120px;padding:48px 24px;text-align:center;border:1px dashed var(--line);color:var(--muted);line-height:1.7}
  .empty code{background:#efece6;padding:2px 6px;border-radius:4px;color:var(--ink)}
  .empty label{display:inline-block;margin-top:14px;padding:10px 18px;border:1px solid var(--ink);color:var(--ink);cursor:pointer;font-size:12px;letter-spacing:.14em;text-transform:uppercase}
  body.drag .empty{border-color:var(--ink);color:var(--ink)}

  .lightbox{position:fixed;inset:0;background:var(--overlay);display:none;align-items:center;justify-content:center;z-index:10}
  .lightbox.open{display:flex}
  .lightbox img{max-width:88vw;max-height:84vh;object-fit:contain}
  .lightbox .cap{position:absolute;bottom:24px;left:0;right:0;text-align:center;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
  .lightbox button{position:absolute;background:none;border:0;font-size:32px;color:var(--ink);cursor:pointer;padding:16px;font-family:Inter,sans-serif;font-weight:300}
  .lb-close{top:12px;right:16px}
  .lb-prev{left:12px;top:50%;transform:translateY(-50%)}
  .lb-next{right:12px;top:50%;transform:translateY(-50%)}

  footer{text-align:center;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding:0 24px 40px}
  @media (max-width:600px){header{padding:28px 16px 20px}.intro,.gallery{padding-left:16px;padding-right:16px}.brand{font-size:28px}.lightbox img{max-width:100vw}}
</style>
</head>
<body>
<header>
  <a class="brand" href="#">Siemens Illustration</a>
  <nav><a class="active" href="#">Gallery</a><a href="#about">About</a><a href="#contact">Contact</a></nav>
</header>
<section class="intro"><h1>Illustrations — ingénierie, industrie &amp; ville durable</h1></section>

<main class="gallery" id="gallery"></main>

<div class="empty" id="empty" hidden>
  Aucune illustration.<br>
  Copiez vos images dans <code>images/</code> puis lancez <code>./build.sh</code>,<br>
  ou glissez le dossier ici.
  <br><label>Choisir des images<input type="file" id="picker" accept="image/*" multiple hidden></label>
</div>

<div class="lightbox" id="lb">
  <button class="lb-close" aria-label="Fermer">×</button>
  <button class="lb-prev" aria-label="Précédente">‹</button>
  <img alt="">
  <button class="lb-next" aria-label="Suivante">›</button>
  <div class="cap"></div>
</div>

<footer>© Siemens Illustration</footer>

<script src="images.js"></script>
<script>
  const gallery = document.getElementById('gallery');
  const empty = document.getElementById('empty');
  const lb = document.getElementById('lb');
  const lbImg = lb.querySelector('img');
  const lbCap = lb.querySelector('.cap');
  let items = [], current = 0;

  function render(list) {
    items = list;
    gallery.innerHTML = '';
    empty.hidden = list.length > 0;
    list.forEach((it, i) => {
      const fig = document.createElement('figure');
      fig.className = 'item';
      const img = new Image();
      img.loading = 'lazy';
      img.alt = it.title;
      img.onload = () => img.classList.add('loaded');
      img.src = it.src;
      const cap = document.createElement('figcaption');
      cap.textContent = it.title;
      fig.append(img, cap);
      fig.onclick = () => open(i);
      gallery.append(fig);
    });
  }

  function open(i) {
    current = (i + items.length) % items.length;
    lbImg.src = items[current].src;
    lbCap.textContent = items[current].title;
    lb.classList.add('open');
  }
  const close = () => lb.classList.remove('open');

  lb.querySelector('.lb-close').onclick = close;
  lb.querySelector('.lb-prev').onclick = e => { e.stopPropagation(); open(current - 1); };
  lb.querySelector('.lb-next').onclick = e => { e.stopPropagation(); open(current + 1); };
  lb.onclick = e => { if (e.target === lb) close(); };
  document.addEventListener('keydown', e => {
    if (!lb.classList.contains('open')) return;
    if (e.key === 'Escape') close();
    if (e.key === 'ArrowLeft') open(current - 1);
    if (e.key === 'ArrowRight') open(current + 1);
  });

  // Chargement local (sans build) : sélection ou glisser-déposer
  function fromFiles(files) {
    const list = [...files].filter(f => f.type.startsWith('image/'))
      .sort((a, b) => a.name.localeCompare(b.name))
      .map(f => ({ src: URL.createObjectURL(f), title: f.name.replace(/\.[^.]+$/, '').replace(/[-_]/g, ' ') }));
    if (list.length) render(list);
  }
  async function readEntries(entry, out) {
    if (entry.isFile) { out.push(await new Promise(r => entry.file(r))); return; }
    if (entry.isDirectory) {
      const reader = entry.createReader();
      let batch;
      do {
        batch = await new Promise(r => reader.readEntries(r));
        for (const e of batch) await readEntries(e, out);
      } while (batch.length);
    }
  }
  document.getElementById('picker').onchange = e => fromFiles(e.target.files);
  addEventListener('dragover', e => { e.preventDefault(); document.body.classList.add('drag'); });
  addEventListener('dragleave', () => document.body.classList.remove('drag'));
  addEventListener('drop', async e => {
    e.preventDefault();
    document.body.classList.remove('drag');
    const files = [];
    for (const it of e.dataTransfer.items) {
      const entry = it.webkitGetAsEntry && it.webkitGetAsEntry();
      if (entry) await readEntries(entry, files);
    }
    fromFiles(files.length ? files : e.dataTransfer.files);
  });

  render(window.ILLUSTRATIONS || []);
</script>
</body>
</html>
